      <script>
        (function() {
          function updateFavicon() {
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var oldFav = document.getElementById('favicon');
            var href = (isDark ? '/images/logo/icon-dark-theme.png' : '/images/logo/icon-light-theme.png') + '?v=2';
            if (oldFav) {
              oldFav.remove();
            }
            var newFav = document.createElement('link');
            newFav.id = 'favicon';
            newFav.rel = 'icon';
            newFav.type = 'image/png';
            newFav.href = href;
            document.head.appendChild(newFav);
          }
          updateFavicon();
          if (window.matchMedia) {
            var matcher = window.matchMedia('(prefers-color-scheme: dark)');
            if (matcher.addEventListener) {
              matcher.addEventListener('change', updateFavicon);
            } else if (matcher.addListener) {
              matcher.addListener(updateFavicon);
            }
          }
        })();
      </script>

            if (targetPath.length > 0) {
              window.history.replaceState(null, '', targetPath);
            }
          }
        })();
      </script>
